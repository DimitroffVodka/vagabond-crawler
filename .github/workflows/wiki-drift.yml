name: Wiki drift

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - "scripts/check-wiki-drift.mjs"
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "scripts/check-wiki-drift.mjs"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The check diffs against a base ref, so it needs history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve base ref
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            # First push on a new branch — nothing to diff against.
            echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: Check docs/ vs docs/wiki/ drift
        run: node scripts/check-wiki-drift.mjs --base "${{ steps.base.outputs.ref }}"
